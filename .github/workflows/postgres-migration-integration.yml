name: PostgreSQL migration integration

on:
  pull_request:
  push:
    branches: [main, p2a-postgres-ci]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  postgres-migration:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    services:
      postgres:
        image: postgres:18.6-bookworm
        env:
          POSTGRES_DB: pos_p2a_test_admin
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: test_only_password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d pos_p2a_test_admin"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 12
    env:
      POSTGRES_INTEGRATION_TEST_URL: postgresql://postgres:test_only_password@127.0.0.1:5432/pos_p2a_test_admin?sslmode=disable&connect_timeout=5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Install PostgreSQL client
        run: |
          sudo apt-get update
          sudo apt-get install --yes --no-install-recommends postgresql-client
      - name: Install project dependencies
        run: npm ci
      - name: Run PostgreSQL migration integration tests
        run: npm run test:pg-migration-integration
